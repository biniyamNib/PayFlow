services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bini@postgres1
      POSTGRES_DB: PayFlow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: